<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Под именем Галина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout concept: a full-bleed night scene painted on canvas, a typeset
   dialogue slab at the bottom, and paper dossier cards that open over it.
   The only red in any frame is Elena's scarf. */
:root {
  color-scheme: dark;
  --ink: #070a12;
  --night: #0e1730;
  --dusk: #1b2a4d;
  --steel: #7f8fb3;
  --ember: #d9482b;
  --lamp: #f0b35a;
  --paper: #d8cdb2;
  --paper-2: #c6b998;
  --paper-ink: #2a2118;
  --text: #ece6d6;
  --mute: #98a2ba;
  --line: rgba(240, 179, 90, .32);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --display: "Old Standard TT", "Times New Roman", Georgia, serif;
  --label: "Oswald", "Arial Narrow", Arial, sans-serif;
  --mono: "PT Mono", "Courier New", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0 0 auto 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 14px var(--gutter-r) 0 var(--gutter-l); pointer-events: none; flex-wrap: wrap; }
#hud > * { pointer-events: auto; }
#plate { display: grid; gap: 2px; padding: 8px 14px 9px; border: 2px solid var(--ember); background: rgba(7, 10, 18, .62);
  transform: rotate(-1.2deg); max-width: min(70vw, 420px); }
#plateplace { font-family: var(--label); font-weight: 600; font-size: 15px; letter-spacing: .04em; color: var(--text); }
#platedate { font-family: var(--mono); font-size: 13px; color: var(--lamp); }
#plate.flash { animation: plateIn .7s ease-out; }
@keyframes plateIn { from { opacity: 0; transform: rotate(-1.2deg) translateY(-10px); } to { opacity: 1; transform: rotate(-1.2deg); } }
#pips { display: grid; gap: 4px; font-family: var(--mono); font-size: 12px; color: var(--mute); padding: 4px 0 0; flex: 1 1 140px; min-width: 0; }
#pips div { display: flex; align-items: center; gap: 8px; }
#pips i { display: inline-flex; gap: 3px; }
#pips b { width: 9px; height: 9px; border: 1px solid var(--mute); display: inline-block; }
#pips b.on { background: var(--lamp); border-color: var(--lamp); }
#tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
#tools button, .btn { font-family: var(--label); font-size: 14px; letter-spacing: .03em; padding: 8px 12px; border: 1px solid rgba(236, 230, 214, .28);
  background: rgba(7, 10, 18, .6); color: var(--text); min-height: 36px; transition: border-color .15s, background .15s; }
#tools button:hover, .btn:hover { border-color: var(--lamp); background: rgba(240, 179, 90, .12); }
.btn.primary { border-color: var(--lamp); background: var(--lamp); color: #1a1208; font-weight: 600; }
.btn.primary:hover { background: #ffc877; }

/* ---------- timeline ---------- */
#timeline { position: absolute; top: env(safe-area-inset-top, 0px); height: 3px; left: var(--gutter-l); right: var(--gutter-r); z-index: 4; display: flex; gap: 0; align-items: center; pointer-events: none; }
#timeline .tick { flex: 1 1 0; height: 3px; margin-right: 2px; background: rgba(236, 230, 214, .16); position: relative; }
#timeline .tick.on { background: var(--lamp); }
#timeline .tick.now::after { content: ""; position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; background: var(--ember); transform: rotate(45deg); }

/* ---------- dialogue ---------- */
#dialog { position: absolute; z-index: 6; left: var(--gutter-l); right: var(--gutter-r); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  max-width: 980px; margin-inline: auto; padding: 14px 22px 16px; cursor: pointer;
  background: linear-gradient(to top, rgba(6, 9, 17, .95), rgba(6, 9, 17, .80)); border-top: 1px solid var(--line);
  box-shadow: 0 -24px 60px rgba(0, 0, 0, .45); }
#dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 22px; }
#who { font-family: var(--label); font-weight: 600; font-size: 15px; color: var(--lamp); letter-spacing: .04em; }
#tag { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; }
#tag.fact { color: var(--lamp); }
#tag.recon { color: var(--steel); border-style: dashed; }
#tag.game { color: var(--steel); border-style: dotted; }
#txt { margin: 8px 0 0; font-size: clamp(17px, 1.1vw + 12px, 22px); line-height: 1.55; min-height: 3.1em; max-width: 68ch; text-wrap: pretty; }
#txt.narr { font-style: italic; color: #e4dcc7; }
#dfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 26px; margin-top: 6px; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.chip { font-family: var(--mono); font-size: 12px; padding: 1px 7px; border: 1px solid rgba(236, 230, 214, .35); color: var(--mute); }
.chip:hover { border-color: var(--lamp); color: var(--lamp); }
.chip.warn { border-color: var(--ember); color: #f2a08f; }
#more { font-family: var(--mono); color: var(--lamp); animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* ---------- choices ---------- */
#choices { position: absolute; z-index: 7; left: var(--gutter-l); right: var(--gutter-r); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  max-width: 980px; margin-inline: auto; display: grid; gap: 8px; padding: 14px 0 0; }
#choices .prompt { font-family: var(--display); font-style: italic; font-size: clamp(19px, 1.4vw + 13px, 26px); line-height: 1.3; padding: 14px 18px;
  background: rgba(6, 9, 17, .92); border-left: 3px solid var(--ember); text-wrap: balance; }
#choices .kind { font-family: var(--mono); font-size: 12px; color: var(--steel); margin-bottom: 4px; display: block; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; padding: 12px 16px; background: rgba(14, 23, 48, .92);
  border: 1px solid rgba(236, 230, 214, .22); font-size: clamp(16px, .8vw + 12px, 19px); line-height: 1.4; transition: border-color .15s, transform .15s, background .15s; }
.opt:hover { border-color: var(--lamp); background: rgba(27, 42, 77, .95); transform: translateX(4px); }
.opt kbd { font-family: var(--mono); font-size: 13px; color: var(--lamp); border: 1px solid var(--line); padding: 1px 0; text-align: center; }

/* ---------- reveal card ---------- */
#reveal { position: absolute; z-index: 9; inset: 0; display: grid; place-items: center; padding: 20px var(--gutter-r) 20px var(--gutter-l); background: rgba(4, 6, 12, .62); }
.sheet { position: relative; width: min(640px, 100%); max-height: 88%; overflow: auto; padding: 26px 28px 24px; color: var(--paper-ink);
  background: linear-gradient(172deg, #dcd1b6 0%, #cfc2a1 100%); box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 0 60px rgba(120, 90, 40, .18);
  font-family: var(--display); transform: rotate(-.4deg); animation: sheetIn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes sheetIn { from { opacity: 0; transform: translateY(26px) rotate(1.4deg); } to { opacity: 1; transform: rotate(-.4deg); } }
.sheet h3 { margin: 0 0 6px; font-size: clamp(22px, 2vw + 12px, 30px); line-height: 1.15; font-weight: 700; text-wrap: balance; }
.sheet .meta { font-family: var(--mono); font-size: 12px; color: #6b5a3f; margin-bottom: 12px; }
.sheet p { margin: 0 0 10px; font-size: clamp(16px, .6vw + 13px, 19px); line-height: 1.5; font-family: var(--serif); }
.sheet .stamp { display: inline-block; margin: 0 0 12px; transform-origin: left center; font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .06em; padding: 4px 10px;
  border: 2px solid var(--ember); color: var(--ember); transform: rotate(-2deg); opacity: .88; mix-blend-mode: multiply; background: transparent; }
.sheet .stamp.ok { border-color: #2e6b4c; color: #2e6b4c; }
.sheet .stamp.warn { border-color: #8a5a12; color: #8a5a12; }
.sheet .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 14px; }
.sheet .chip { border-color: rgba(42, 33, 24, .5); color: #4b3d2a; background: transparent; }
.sheet .chip:hover { border-color: var(--ember); color: var(--ember); }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 10px; }
.sheet .btn { color: var(--paper-ink); border-color: rgba(42, 33, 24, .6); background: transparent; }
.sheet .btn:hover { background: rgba(42, 33, 24, .1); border-color: var(--paper-ink); }
.sheet .btn.primary { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }

/* ---------- toast ---------- */
#toast { position: absolute; z-index: 8; right: var(--gutter-r); top: 76px; max-width: min(340px, 80vw); padding: 10px 14px; background: rgba(240, 179, 90, .96);
  color: #1a1208; font-family: var(--label); font-size: 14px; letter-spacing: .02em; animation: toastIn .4s ease-out; text-align: left; }
@keyframes toastIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

/* ---------- chapter card ---------- */
#chapter { position: absolute; z-index: 30; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: radial-gradient(ellipse at center, #0c1226 0%, #04060b 80%); cursor: pointer; animation: fadeIn .5s ease-out; }
#chapter .n { font-family: var(--label); font-size: 16px; letter-spacing: .12em; color: var(--ember); }
#chapter h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6vw + 8px, 78px); line-height: 1.05; text-wrap: balance; }
#chapter .d { font-family: var(--mono); color: var(--lamp); font-size: 15px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- title screen ---------- */
#title { position: absolute; z-index: 50; inset: 0; display: grid; align-content: end; justify-items: start; gap: 18px;
  padding: 24px var(--gutter-r) max(28px, env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: linear-gradient(to top, rgba(4, 6, 12, .92) 0%, rgba(4, 6, 12, .35) 55%, rgba(4, 6, 12, 0) 100%); }
#title .wrap { width: min(1100px, 100%); margin-inline: auto; display: grid; gap: 14px; }
#title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(44px, 9vw + 8px, 132px); line-height: .95; text-wrap: balance;
  text-shadow: 0 4px 40px rgba(0, 0, 0, .7); }
#title .sub { font-family: var(--display); font-style: italic; font-size: clamp(18px, 1.6vw + 10px, 28px); color: #e4dcc7; max-width: 30ch; }
#title .contest { font-family: var(--mono); font-size: 13px; color: var(--lamp); }
#title .btns { display: flex; flex-wrap: wrap; gap: 10px; }
#title .btn { font-size: 17px; padding: 12px 22px; }
#title .credit { font-family: var(--mono); font-size: 12px; color: var(--mute); }
#title .scarf { width: 56px; height: 6px; background: var(--ember); margin-bottom: 4px; }

/* ---------- panels ---------- */
#panel { position: absolute; z-index: 40; inset: 0; background: #070a12; overflow: auto; padding: 20px var(--gutter-r) 28px var(--gutter-l); animation: fadeIn .25s ease-out; }
.resgrid { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 22px; align-items: start; width: min(960px, 100%); justify-self: center; }
.portrait { margin: 0; padding: 12px 12px 14px; background: linear-gradient(172deg, #dcd1b6, #cbbe9d); color: var(--paper-ink); box-shadow: 0 24px 60px rgba(0, 0, 0, .55); transform: rotate(-1.2deg); }
.portrait img { display: block; width: 100%; height: auto; filter: contrast(1.03); }
.portrait figcaption { margin-top: 10px; font-family: var(--display); font-size: 17px; line-height: 1.3; text-align: center; }
.portrait small { font-family: var(--mono); font-size: 11px; color: #6b5a3f; }
@media (max-width: 720px) { .resgrid { grid-template-columns: minmax(0, 1fr); } .portrait { width: min(240px, 70%); justify-self: center; } }
#panel .sheet { max-height: none; overflow: visible; }
#panel .in { width: min(1000px, 100%); margin-inline: auto; display: grid; gap: 18px; }
#panel header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
#panel h2 { margin: 0; font-family: var(--display); font-size: clamp(26px, 3vw + 10px, 44px); line-height: 1.1; }
#panel .lede { color: var(--mute); max-width: 62ch; margin: 0; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.card { text-align: left; padding: 14px 16px 16px; min-height: 130px; display: grid; align-content: start; gap: 6px; background: linear-gradient(172deg, #d9ceb3, #cbbe9d); color: var(--paper-ink);
  font-family: var(--display); box-shadow: 0 10px 26px rgba(0, 0, 0, .4); transition: transform .15s; }
.card:hover { transform: translateY(-3px) rotate(-.6deg); }
.card h4 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 700; }
.card small { font-family: var(--mono); font-size: 12px; color: #5d4d35; line-height: 1.4; }
.card.locked { background: rgba(236, 230, 214, .05); color: var(--mute); border: 1px dashed rgba(236, 230, 214, .22); box-shadow: none; cursor: default; }
.card.locked:hover { transform: none; }
.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { padding: 12px 16px; background: rgba(14, 23, 48, .7); border-left: 3px solid var(--line); line-height: 1.5; }
.list li b { font-family: var(--mono); color: var(--lamp); font-weight: 400; margin-right: 8px; }
.list li em { color: var(--mute); }
.log p { margin: 0 0 10px; line-height: 1.5; }
.log .w { color: var(--lamp); font-family: var(--label); margin-right: 8px; }
.log .tg { color: var(--mute); font-family: var(--mono); font-size: 12px; margin-left: 8px; }
.set { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; gap: 10px 16px; align-items: center; }
.set label { color: var(--mute); }
.set input[type=range] { width: 100%; accent-color: var(--lamp); }
.slots { display: grid; gap: 8px; }
.slots .btn { text-align: left; display: flex; justify-content: space-between; gap: 12px; }
.about { line-height: 1.6; max-width: 70ch; }
.about h3 { font-family: var(--display); margin: 18px 0 4px; font-size: 22px; }
.about p, .about li { margin: 0 0 8px; }

/* ---------- mini games ---------- */
#mini { position: absolute; z-index: 35; inset: 0; background: radial-gradient(ellipse at center, #0b1328 0%, #04060b 85%); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding: 14px var(--gutter-r) max(14px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); animation: fadeIn .4s ease-out; }
#mini .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
#mini h3 { margin: 0; font-family: var(--display); font-size: clamp(22px, 2.4vw + 10px, 36px); }
#mini .hint { color: var(--mute); max-width: 60ch; margin: 4px 0 0; line-height: 1.45; font-size: 16px; }
#mini .stage { position: relative; min-height: 0; display: grid; place-items: center; }
#mini canvas { max-width: 100%; max-height: 100%; background: #060912; border: 1px solid var(--line); touch-action: none; }
#mini .foot { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; color: var(--mute); font-family: var(--mono); font-size: 13px; }
.msg { position: absolute; inset: auto 0 14px 0; text-align: center; font-family: var(--display); font-style: italic; font-size: clamp(20px, 2vw + 10px, 30px); color: var(--text); text-shadow: 0 2px 20px #000; pointer-events: none; }
.wheel { width: min(520px, 90vw, 62vh); height: auto; aspect-ratio: 1; }
.cipher { font-family: var(--mono); font-size: clamp(20px, 3vw + 8px, 34px); letter-spacing: .18em; text-align: center; line-height: 1.5; }
.cipher .dec { color: var(--lamp); min-height: 1.5em; }
.cipher .enc { color: var(--mute); }
.claim { width: min(720px, 100%); padding: 20px 24px; background: linear-gradient(172deg, #d9ceb3, #cbbe9d); color: var(--paper-ink); font-family: var(--serif); font-size: clamp(18px, 1.2vw + 13px, 24px); line-height: 1.4;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5); transform: rotate(-.5deg); }
.claim small { display: block; font-family: var(--mono); font-size: 12px; color: #6b5a3f; margin-bottom: 8px; }
.bins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(720px, 100%); }
.bins .btn { text-align: left; padding: 12px 14px; font-size: 15px; line-height: 1.3; font-family: var(--serif); min-height: 56px; }
.fb { width: min(720px, 100%); padding: 12px 16px; border-left: 3px solid var(--lamp); background: rgba(14, 23, 48, .9); line-height: 1.5; }
.fb.bad { border-color: var(--ember); }
.dpad { display: none; }
@media (pointer: coarse) { .dpad { display: grid; } }

@media (max-width: 640px) {
  #tools button { padding: 6px 9px; font-size: 13px; min-height: 32px; }
  #dialog { padding: 12px 16px 14px; }
  #txt { min-height: 5.2em; }
  .bins { grid-template-columns: 1fr; }
  .set { grid-template-columns: 1fr; }
  #toast { top: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

</head>
<body>
<div id="app" tabindex="-1">
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="hud" hidden>
    <div id="plate"><span id="plateplace"></span><span id="platedate"></span></div>
    <div id="pips" aria-label="Показатели"></div>
    <div id="tools">
      <button type="button" id="bLog">Журнал</button>
      <button type="button" id="bDos">Досье</button>
      <button type="button" id="bSrc">Источники</button>
      <button type="button" id="bSnd" aria-pressed="false">Звук</button>
      <button type="button" id="bMenu">Меню</button>
    </div>
  </div>
  <div id="timeline" hidden></div>

  <div id="dialog" hidden role="region" aria-live="polite">
    <div id="dhead"><span id="who"></span><span id="tag"></span></div>
    <p id="txt"></p>
    <div id="dfoot"><span id="chips"></span><span id="more" aria-hidden="true">▾</span></div>
  </div>
  <div id="choices" hidden></div>
  <div id="reveal" hidden></div>
  <button type="button" id="toast" hidden></button>
  <div id="chapter" hidden></div>

  <div id="title">
    <div class="wrap">
      <div class="scarf"></div>
      <h1>Под именем Галина</h1>
      <div class="sub">Интерактивная история о Елене Мазаник по документам и воспоминаниям</div>
      <div class="contest" id="contestLine">Республиканский конкурс «ПАТРИОТ.by» · номинация «Женское лицо Победы»</div>
      <div class="btns" id="titleBtns">
        <button type="button" class="btn primary" id="bStart">Начать историю</button>
        <button type="button" class="btn" id="bCont" hidden>Продолжить</button>
        <button type="button" class="btn" id="bDos2">Досье</button>
        <button type="button" class="btn" id="bSrc2">Источники</button>
        <button type="button" class="btn" id="bAbout">О проекте</button>
      </div>
      <div class="credit" id="credit"></div>
    </div>
  </div>

  <div id="panel" hidden></div>
  <div id="mini" hidden></div>
</div>

<script>
(function(){
/* ===================== Утилиты ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const el = (tag, attrs, html) => { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; };

    case 'chapter': return showChapter(b);
